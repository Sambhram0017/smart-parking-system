<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smart_parking_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>smart_parking_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay Checkout SDK for Web -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.payWithRazorpay = function(key, amount, orderId, name, description, onSuccess, onFailure) {
      var options = {
        "key": key,
        "amount": amount,
        "currency": "INR",
        "name": name || "Smart Parking System",
        "description": description || "Parking Fee",
        "order_id": orderId,
        "handler": function (response) {
          console.log("✅ Razorpay payment success:", response);
          if (window.onRazorpaySuccess) {
            window.onRazorpaySuccess(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
          }
        },
        "modal": {
          "ondismiss": function() {
            console.log("⚠️ Razorpay modal dismissed");
            if (window.onRazorpayFailure) {
              window.onRazorpayFailure("Payment cancelled by user");
            }
          }
        },
        "prefill": {
          "contact": "9876543210",
          "email": "user@parking.com"
        },
        "theme": {
          "color": "#00E5FF"
        }
      };
      try {
        var rzp1 = new Razorpay(options);
        rzp1.on('payment.failed', function (response) {
          if (window.onRazorpayFailure) {
            window.onRazorpayFailure(response.error.description || "Payment Failed");
          }
        });
        rzp1.open();
      } catch (e) {
        console.error("Razorpay open error:", e);
        if (window.onRazorpayFailure) {
          window.onRazorpayFailure(e.message || "Failed to launch Razorpay popup");
        }
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
